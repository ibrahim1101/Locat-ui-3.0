name: Locat core checks
on:
  push:
    branches: [integration/locat-core]
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: locat-ui-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: locat-ui-3.0/package-lock.json
      - name: Install Linux media and TLS test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - name: Install Windows media and TLS test tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg openssl --yes --no-progress
          "$env:ProgramFiles\OpenSSL-Win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install macOS media and TLS test tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build
      - name: Set up isolated Matrix acceptance Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locat-ui-3.0/tools/matrix-test-requirements.txt
      - name: Install pinned synthetic homeserver test environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/locat-matrix-python"
          "$RUNNER_TEMP/locat-matrix-python/bin/pip" install -r tools/matrix-test-requirements.txt
      - name: Real Matrix crypto and durable offline acceptance
        if: runner.os == 'Linux'
        env:
          LOCAT_TEST_SYNAPSE_PYTHON: ${{ runner.temp }}/locat-matrix-python/bin/python
        run: npm run test:matrix

  browser-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: locat-ui-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: locat-ui-3.0/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_LOCAT_MESSAGING_ACCEPTANCE: 'true'
      - name: Install isolated Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Set up browser Matrix acceptance Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locat-ui-3.0/tools/matrix-test-requirements.txt
      - name: Install pinned browser homeserver test environment
        run: |
          python -m venv "$RUNNER_TEMP/locat-browser-matrix-python"
          "$RUNNER_TEMP/locat-browser-matrix-python/bin/pip" install -r tools/matrix-test-requirements.txt
      - name: Built UI and browser storage foundation
        env:
          LOCAT_TEST_SYNAPSE_PYTHON: ${{ runner.temp }}/locat-browser-matrix-python/bin/python
        run: npm run test:browser
      - name: Repeated private-store foreground acceptance
        env:
          LOCAT_BROWSER_REPORT: test-results/private-store-repeat-results.json
        run: npm run test:browser -- foundation.spec.mjs --repeat-each=3
      - name: Browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-foundation-report
          path: locat-ui-3.0/test-results/*results.json
          if-no-files-found: warn
          retention-days: 7
