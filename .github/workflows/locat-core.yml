name: Locat core checks
on:
  push:
    branches: [integration/locat-core]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: locat-ui-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: locat-ui-3.0/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build
