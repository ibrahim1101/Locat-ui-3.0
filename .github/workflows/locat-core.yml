name: Locat core checks
on:
  push:
    branches: [integration/locat-core]
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: locat-ui-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: locat-ui-3.0/package-lock.json
      - name: Install Linux media and TLS test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - name: Install Windows media and TLS test tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg openssl --yes --no-progress
            $env:Path = "$env:ProgramFiles\OpenSSL-Win64\bin;" + [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
            $tools = @('ffmpeg', 'ffprobe', 'openssl')
            $missing = @($tools | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) })
            if ($missing.Count -eq 0) { break }
            if ($attempt -eq 3) { throw "Media/TLS installation incomplete after three attempts: $($missing -join ', ')" }
            Write-Warning 'Package feed or tool installation unavailable; retrying in ten seconds.'
            Start-Sleep -Seconds 10
          }
          $tools | ForEach-Object { Split-Path (Get-Command $_).Source } | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg startup failed' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe startup failed' }
          openssl version
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL startup failed' }
      - name: Install macOS media and TLS test tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build
      - name: Set up isolated Matrix acceptance Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locat-ui-3.0/tools/matrix-test-requirements.txt
      - name: Install pinned synthetic homeserver test environment
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/locat-matrix-python"
          "$RUNNER_TEMP/locat-matrix-python/bin/pip" install -r tools/matrix-test-requirements.txt
      - name: Real Matrix crypto and durable offline acceptance
        if: runner.os == 'Linux'
        env:
          LOCAT_TEST_SYNAPSE_PYTHON: ${{ runner.temp }}/locat-matrix-python/bin/python
        run: npm run test:matrix

  browser-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: locat-ui-3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: locat-ui-3.0/package-lock.json
      - run: npm ci
      - run: npm run build
        id: browser_build
      - name: Install isolated browser runtimes
        id: browser_runtimes
        run: npx playwright install --with-deps chromium firefox
      - name: Install browser Cinema media tools
        id: browser_media_tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up browser Matrix acceptance Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locat-ui-3.0/tools/matrix-test-requirements.txt
      - name: Install pinned browser homeserver test environment
        run: |
          python -m venv "$RUNNER_TEMP/locat-browser-matrix-python"
          "$RUNNER_TEMP/locat-browser-matrix-python/bin/pip" install -r tools/matrix-test-requirements.txt
      - name: Built UI and browser storage foundation
        env:
          LOCAT_TEST_SYNAPSE_PYTHON: ${{ runner.temp }}/locat-browser-matrix-python/bin/python
        run: npm run test:browser
      - name: Firefox Cinema and existing-feature acceptance
        if: ${{ !cancelled() && steps.browser_build.outcome == 'success' && steps.browser_runtimes.outcome == 'success' && steps.browser_media_tools.outcome == 'success' }}
        env:
          LOCAT_BROWSER_ENGINE: firefox
          LOCAT_BROWSER_REPORT: test-results/cinema-firefox-results.json
        run: npm run test:browser -- cinema.spec.mjs foundation.spec.mjs link.spec.mjs photos.spec.mjs sentinel.spec.mjs
      - name: Repeated private-store foreground acceptance
        env:
          LOCAT_BROWSER_REPORT: test-results/private-store-repeat-results.json
        run: npm run test:browser -- foundation.spec.mjs --repeat-each=3
      - name: Browser acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-foundation-report
          path: locat-ui-3.0/test-results/*results.json
          if-no-files-found: warn
          retention-days: 7
